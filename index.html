<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2340">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Wordrobe - Word Puzzle Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect width=%2248%22 height=%2248%22 rx=%2212%22 fill=%22%231B2340%22/%3E%3Ctext x=%2224%22 y=%2233%22 font-size=%2224%22 text-anchor=%22middle%22 fill=%22%23FFD27A%22 font-family=%22Arial%22 font-weight=%22bold%22%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2340;--gold:#FFC857;--gold2:#E8A93A;--ok:#2ECC8F;--bad:#FF5D73;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:#fff;background:#1B2340;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0}
.hidden{display:none!important}
#bg{position:fixed;inset:0;z-index:0;transition:opacity .6s}
#bg img{width:100%;height:100%;object-fit:cover;display:block}
#shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,14,35,.35) 0%,rgba(10,14,35,0) 30%,rgba(10,14,35,.15) 60%,rgba(10,14,35,.55) 100%)}
.screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 16px)}
.glass{background:rgba(255,255,255,.16);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.28);border-radius:26px;box-shadow:0 10px 40px rgba(10,14,35,.25)}
.solid{background:rgba(255,255,255,.26);backdrop-filter:blur(5px) saturate(1.3);-webkit-backdrop-filter:blur(5px) saturate(1.3);border:1px solid rgba(255,255,255,.45);color:var(--ink);border-radius:26px;box-shadow:0 10px 30px rgba(10,14,35,.18)}

/* ---- home ---- */
#home{justify-content:space-between}
.brand{text-align:center;margin-top:4vh}
.brand h1{margin:0;font-size:44px;font-weight:900;letter-spacing:-.5px;text-shadow:0 4px 20px rgba(0,0,0,.35)}
.brand p{margin:6px 0 0;font-size:16px;font-weight:700;opacity:.92;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.home-card{padding:18px;display:flex;flex-direction:column;gap:12px}
.lang-row{display:flex;gap:10px}
.lang{flex:1;height:58px;border-radius:18px;background:rgba(255,255,255,.18);font-weight:800;font-size:17px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px}
.lang.on{background:#fff;color:var(--ink);border-color:var(--gold)}
.lang small{font-size:12px;opacity:.7;font-weight:700}
.big{height:60px;border-radius:20px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink);font-weight:900;font-size:20px;box-shadow:0 5px 0 #B9802A}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #B9802A}
.row2{display:flex;gap:10px}
.ghost{flex:1;height:50px;border-radius:16px;background:rgba(255,255,255,.18);font-weight:800;font-size:15px}
.stats{display:flex;justify-content:space-around;text-align:center;font-weight:800}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;opacity:.85}
.label{font-size:13px;font-weight:800;opacity:.85;margin:0 4px -4px;text-transform:uppercase;letter-spacing:.6px}

/* ---- game ---- */
.top{display:flex;align-items:center;gap:10px}
.icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.icon svg{width:22px;height:22px}
.place{flex:1;min-width:0;padding:8px 14px;border-radius:16px}
.place b{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.35)}
.dots i.on{background:var(--gold)}
.coins{height:44px;padding:0 12px;border-radius:14px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:16px;flex:none}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE7A3,#F2B53A 60%,#C98A1E);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.spacer{flex:1}
.card{padding:14px 14px 14px;text-align:center;transition:transform .2s;align-self:center;max-width:100%}
.cat{display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.4);font-size:12px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#5A6387}
.hint{font-size:15px;font-weight:800;color:#3A4366;margin:12px 0 4px}
.meaning{font-size:18px;line-height:1.3;font-weight:800;color:var(--ink);margin:0 2px 12px;display:flex;align-items:center;justify-content:center}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:nowrap}
.slot{border-radius:12px;display:grid;place-items:center;font-weight:900;color:var(--ink);background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.6);transition:all .15s}
.slot.given{background:rgba(255,255,255,.62);border-color:rgba(255,255,255,.75);box-shadow:0 2px 0 rgba(27,35,64,.12)}
.slot.blank{background:rgba(255,247,227,.35);border:2px dashed #E8A93A}
.slot.filled{background:rgba(255,232,174,.75);border:2px solid #E8A93A}
.slot.next{box-shadow:0 0 0 3px rgba(232,169,58,.35)}
.slot.win{background:var(--ok);border-color:var(--ok);color:#fff}
.card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.card.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.04)}}
.reward:empty{display:none}
.reward{margin-top:10px;font-weight:900;color:#13865B;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 12px}
.tile{aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.6);color:var(--ink);font-weight:900;font-size:24px;box-shadow:0 3px 0 rgba(27,35,64,.25);transition:transform .1s,opacity .2s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #C9CEE0}
.tile.used{opacity:0;pointer-events:none}
.actions{display:flex;gap:10px}
.act{flex:1;height:52px;border-radius:18px;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.act svg{width:20px;height:20px}
.act .cost{display:flex;align-items:center;gap:3px;font-size:13px;opacity:.9}
.act .cost .coin{width:14px;height:14px}

#card, .tile{text-shadow:0 0 6px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.9)}
.slot.win{text-shadow:none}
/* ---- sheets ---- */
.sheet{position:fixed;inset:0;z-index:5;background:rgba(10,14,35,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:20px 18px calc(var(--sb) + 20px);border-radius:28px 28px 0 0}
.panel h2{margin:0 0 4px;font-size:24px;font-weight:900}
.panel p{margin:0 0 12px;color:#5A6387;font-weight:700;line-height:1.4}
.wordlist{display:flex;flex-direction:column;gap:6px;margin:10px 0 16px}
.wordlist div{display:flex;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.6);border-radius:14px;font-weight:800}
.wordlist div span:last-child{color:#5A6387}
.empty{color:#8C93AE;font-weight:700;text-align:center;padding:20px}
.close{width:100%;height:52px;border-radius:18px;background:var(--ink);color:#fff;font-weight:900;font-size:16px}
.trip{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,14,35,.12)}
.trip .solid{padding:22px;text-align:center;max-width:400px;width:100%}
.trip .solid small{display:block;font-weight:900;color:var(--gold2);letter-spacing:.8px;text-transform:uppercase;font-size:12px}
.trip h2{margin:6px 0 2px;font-size:28px;font-weight:900}
.trip .where{font-weight:800;color:#3A4366;margin-bottom:12px}
.trip .fact{background:rgba(255,255,255,.55);border-radius:16px;padding:12px 14px;font-weight:700;line-height:1.45;color:#3A4366;margin-bottom:16px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 70px);transform:translateX(-50%);z-index:9;background:rgba(27,35,64,.92);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>

<!-- HOME -->
<section id="home" class="screen">
  <div class="brand"><h1>Wordrobe</h1><p id="tagline"></p></div>
  <div class="glass home-card">
    <div class="label" id="lblLang"></div>
    <div class="lang-row">
      <button class="lang" data-lang="en">English <small>EN</small></button>
      <button class="lang" data-lang="tr">Türkçe <small>TR</small></button>
    </div>
    <div class="stats glass" style="padding:12px;border-radius:18px">
      <div><b id="stLevel">1</b><span id="lblLevel"></span></div>
      <div><b id="stWords">0</b><span id="lblWords"></span></div>
      <div><b id="stPlaces">0</b><span id="lblPlaces"></span></div>
    </div>
    <button class="big" id="playBtn"></button>
    <div class="row2">
      <button class="ghost" id="wordsBtn"></button>
      <button class="ghost" id="aboutBtn"></button>
    </div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen hidden">
  <div class="top">
    <button class="icon glass" id="homeBtn" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
    <div class="place glass"><b id="placeName"></b><div class="dots" id="dots"></div></div>
    <div class="coins glass"><span class="coin"></span><span id="coinCount">0</span></div>
  </div>
  <div class="spacer"></div>
  <div class="card solid" id="card">
    <div class="meaning" id="meaning"></div>
    <div class="slots" id="slots"></div>
    <div class="reward" id="reward"></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="actions">
    <button class="act glass" id="revealBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/></svg><span id="lblReveal"></span><span class="cost"><span class="coin"></span>30</span></button>
    <button class="act glass" id="shuffleBtn" style="flex:.55"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="act glass" id="skipBtn" style="flex:.8"><span id="lblSkip"></span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg></button>
  </div>
</section>

<!-- SHEETS -->
<div class="sheet hidden" id="wordsSheet"><div class="panel solid">
  <h2 id="wordsTitle"></h2><p id="wordsSub"></p>
  <div class="wordlist" id="wordList"></div>
  <button class="close" data-close></button>
</div></div>
<div class="sheet hidden" id="aboutSheet"><div class="panel solid">
  <h2 id="aboutTitle"></h2><p id="aboutText"></p>
  <button class="ghost" id="resetBtn" style="width:100%;background:#F3F4FA;color:#C23B52;margin-bottom:10px"></button>
  <button class="close" data-close></button>
</div></div>
<div class="trip hidden" id="trip"><div class="solid">
  <small id="tripSmall"></small><h2 id="tripName"></h2><div class="where" id="tripWhere"></div>
  <div class="fact" id="tripFact"></div>
  <button class="big" id="tripGo" style="width:100%"></button>
</div></div>
<div id="toast"></div>

    alps() {

    ['admont', 'Admont Abbey Library', 'Admont Manastırı Kütüphanesi', 'Austria', 'Avusturya', 'It is the largest monastery library in the world.', 'Dünyanın en büyük manastır kütüphanesidir.'],
    ['sahara', 'Sahara Desert', 'Büyük Sahra Çölü', 'North Africa', 'Kuzey Afrika', 'It is the largest hot desert on Earth.', 'Dünyanın en büyük sıcak çölüdür.'],
    ['fuji', 'Mount Fuji', 'Fuji Dağı', 'Japan', 'Japonya', 'It is the highest mountain in Japan.', 'Japonya\'nın en yüksek dağıdır.'],

})();

const T = {
  en: { tagline:'Complete words, travel the world', lang:'Play in', level:'Level', words:'Words', places:'Places', play:'Play', cont:'Continue',
    myWords:'My words', about:'How to play', hint:'Clue', reveal:'Letter', skip:'Skip', trans:'Turkish',
    wordsTitle:'My words', wordsSub:'Words you have completed.', none:'No words yet. Start playing!',
    aboutTitle:'How to play', aboutText:'Each puzzle is an English word with missing letters. Read the clue, then tap the letters to fill the gaps. Tap a filled letter to take it back. When you finish a word, you also see its Turkish meaning. Complete 10 words to travel to a new wonder of the world. Opening a letter costs 30 coins; every word you complete earns 10.',
    reset:'Reset progress', resetSure:'Tap again to confirm', close:'Close', welcome:'Welcome to', next:'Next stop', go:'Let’s go!',
    notEnough:'Not enough coins', correct:'Correct! +10', skipped:'The word was', fact:'Did you know?' },
  tr: { tagline:'Kelimeleri tamamla, dünyayı gez', lang:'Oyun dili', level:'Seviye', words:'Kelime', places:'Yer', play:'Oyna', cont:'Devam et',
    myWords:'Kelimelerim', about:'Nasıl oynanır', hint:'İpucu', reveal:'Harf aç', skip:'Geç', trans:'İngilizcesi',
    wordsTitle:'Kelimelerim', wordsSub:'Tamamladığın kelimeler.', none:'Henüz kelime yok. Oynamaya başla!',
    aboutTitle:'Nasıl oynanır', aboutText:'Her bulmaca harfleri eksik bir Türkçe kelimedir. İpucunu oku, sonra boşlukları doldurmak için harflere dokun. Yerleştirdiğin bir harfi geri almak için üzerine dokun. Kelimeyi tamamlayınca İngilizcesini de görürsün. 10 kelimeyi tamamlayınca yeni bir dünya harikasına yolculuk edersin. Harf açmak 30 jeton; tamamladığın her kelime 10 jeton kazandırır.',
    reset:'İlerlemeyi sıfırla', resetSure:'Onaylamak için tekrar dokun', close:'Kapat', welcome:'Hoş geldin:', next:'Sıradaki durak', go:'Hadi gidelim!',
    notEnough:'Yeterli jeton yok', correct:'Doğru! +10', skipped:'Kelime şuydu:', fact:'Biliyor muydun?' }
};
const ALPHA = { en:'ABCDEFGHIJKLMNOPQRSTUVWXYZ', tr:'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ' };
const PER_PLACE = 10;

/* ---------- data ---------- */
const DEFS = {};
for (const line of DEFS_RAW.trim().split('\n')) { const [k, e, r] = line.split('|'); DEFS[k] = [e, r]; }
const POOL = [];
for (const [key, [cen, ctr, list]] of Object.entries(CATS)) {
  for (const pair of list.split(',')) {
    const [en, tr] = pair.split(':');
    const d = DEFS[en + ':' + tr] || DEFS[en] || [en, tr];
    POOL.push({ en, tr, cat: key, cen, ctr, den: d[0], dtr: d[1] });
  }
}
const up = (w, lang) => w.toLocaleUpperCase(lang === 'tr' ? 'tr-TR' : 'en-US');
const letters = (w, lang) => Array.from(up(w, lang));

/* ---------- state ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('wv-' + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('wv-' + k, JSON.stringify(v)); } catch(e){} }
};
let lang = store.get('lang', (navigator.language || 'en').toLowerCase().startsWith('tr') ? 'tr' : 'en');
let S = loadState();
function freshState(){ return { level: 1, coins: 120, solved: [], seen: [], placeIdx: 0, inPlace: 0 }; }
function loadState(){ return Object.assign(freshState(), store.get('state-' + lang, {})); }
function saveState(){ store.set('state-' + lang, S); store.set('lang', lang); }
const t = k => T[lang][k];
const otherLang = () => lang === 'en' ? 'tr' : 'en';

/* ---------- backgrounds ---------- */
const place = i => SC.PLACES[i % SC.PLACES.length];
function setBg(i){
  const bg = document.getElementById('bg');
  bg.style.opacity = 0;
  const img = new Image(); img.src = `bg/${place(i)[0]}.jpg`; img.alt = '';
  const show = () => { bg.innerHTML = ''; bg.appendChild(img); bg.style.opacity = 1; };
  setTimeout(() => { img.complete ? show() : (img.onload = show, img.onerror = show); }, 220);
}
const placeName = p => lang === 'tr' ? p[2] : p[1];
const placeCountry = p => lang === 'tr' ? p[4] : p[3];
const placeFact = p => lang === 'tr' ? p[6] : p[5];

/* ---------- word choice ---------- */
function pickWord(){
  const maxLen = S.level < 10 ? 5 : S.level < 25 ? 6 : S.level < 45 ? 8 : S.level < 70 ? 10 : 14;
  const minLen = S.level < 10 ? 3 : S.level < 45 ? 4 : 5;
  const seen = new Set(S.seen);
  let cand = POOL.filter(w => { const n = letters(w[lang], lang).length; return n >= minLen && n <= maxLen && !seen.has(w[lang]); });
  if (cand.length < 5) cand = POOL.filter(w => !seen.has(w[lang]) && letters(w[lang], lang).length >= 3);
  if (!cand.length){ S.seen = []; cand = POOL.slice(); }
  return cand[Math.floor(Math.random() * cand.length)];
}

/* ---------- puzzle ---------- */
let P = null;   // {word, chars, blanks:[idx], filled:{idx:tileId}, tiles:[{ch,used}]}
function newPuzzle(){
  const w = pickWord();
  const chars = letters(w[lang], lang);
  const n = chars.length;
  let missing = Math.min(n - 1, Math.max(1, Math.round(n * (S.level < 10 ? .35 : S.level < 30 ? .5 : S.level < 60 ? .6 : .7))));
  const idxs = [...Array(n).keys()];
  shuffle(idxs);
  let blanks = idxs.slice(0, missing).sort((a, b) => a - b);
  if (S.level < 15 && blanks.includes(0) && n > 3 && missing < n - 1) {   // early on, show first letter
    const alt = idxs.find(i => i !== 0 && !blanks.includes(i));
    blanks = blanks.filter(i => i !== 0).concat(alt).sort((a, b) => a - b);
  }
  const need = blanks.map(i => chars[i]);
  const extra = Math.max(3, 12 - need.length > 6 ? 6 : 12 - need.length);
  const alpha = Array.from(ALPHA[lang]);
  const tiles = need.slice();
  while (tiles.length < Math.min(12, need.length + extra)) tiles.push(alpha[Math.floor(Math.random() * alpha.length)]);
  shuffle(tiles);
  P = { w, chars, blanks, filled: {}, tiles: tiles.map(ch => ({ ch, used: false })), done: false };
  render();
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function render(){
  const ol = otherLang();
  document.getElementById('meaning').textContent = lang === 'tr' ? P.w.dtr : P.w.den;
  document.getElementById('reward').textContent = '';
  const slots = document.getElementById('slots');
  slots.innerHTML = '';
  const n = P.chars.length;
  const avail = Math.min(window.innerWidth, 520) - 32 - 28;
  const size = Math.max(24, Math.min(46, Math.floor((avail - (n - 1) * 6) / n)));
  const nextBlank = P.blanks.find(i => P.filled[i] === undefined);
  P.chars.forEach((ch, i) => {
    const d = document.createElement('button');
    d.className = 'slot';
    d.style.width = size + 'px'; d.style.height = Math.round(size * 1.18) + 'px'; d.style.fontSize = Math.round(size * .55) + 'px';
    if (!P.blanks.includes(i)) { d.classList.add('given'); d.textContent = ch; }
    else if (P.filled[i] !== undefined) { d.classList.add('filled'); d.textContent = P.tiles[P.filled[i]].ch; d.onclick = () => unfill(i); }
    else { d.classList.add('blank'); if (i === nextBlank) d.classList.add('next'); }
    if (P.done) d.className = 'slot win', d.textContent = ch;
    slots.appendChild(d);
  });
  const rowW = n * size + (n - 1) * 6;
  document.getElementById('card').style.width = Math.min(Math.max(rowW + 28, 230), Math.min(window.innerWidth, 520) - 32) + 'px';
  const tiles = document.getElementById('tiles');
  tiles.innerHTML = '';
  tiles.style.gridTemplateColumns = `repeat(${P.tiles.length > 10 ? 6 : Math.min(6, P.tiles.length)},1fr)`;
  P.tiles.forEach((tl, k) => {
    const b = document.createElement('button');
    b.className = 'tile' + (tl.used ? ' used' : '');
    b.textContent = tl.ch;
    b.onclick = () => place_(k);
    tiles.appendChild(b);
  });
  document.getElementById('coinCount').textContent = S.coins;
  const p = place(S.placeIdx);
  document.getElementById('placeName').textContent = placeName(p) + ' · ' + placeCountry(p);
  const dots = document.getElementById('dots'); dots.innerHTML = '';
  for (let k = 0; k < PER_PLACE; k++){ const i = document.createElement('i'); if (k < S.inPlace) i.className = 'on'; dots.appendChild(i); }
}

function place_(k){
  if (P.done || P.tiles[k].used) return;
  const i = P.blanks.find(i => P.filled[i] === undefined);
  if (i === undefined) return;
  P.filled[i] = k; P.tiles[k].used = true;
  buzz(8);
  render();
  if (P.blanks.every(i => P.filled[i] !== undefined)) check();
}
function unfill(i){
  if (P.done) return;
  const k = P.filled[i]; if (k === undefined) return;
  P.tiles[k].used = false; delete P.filled[i]; render();
}
function check(){
  const ok = P.blanks.every(i => P.tiles[P.filled[i]].ch === P.chars[i]);
  const card = document.getElementById('card');
  if (ok){ win(); return; }
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  buzz([30, 40, 30]);
  setTimeout(() => {   // return wrong letters
    P.blanks.forEach(i => { if (P.tiles[P.filled[i]].ch !== P.chars[i]) { P.tiles[P.filled[i]].used = false; delete P.filled[i]; } });
    render();
  }, 450);
}
function win(skipped){
  P.done = true;
  if (!skipped){
    S.coins += 10;
    if (!S.solved.some(x => x[0] === P.w[lang])) S.solved.push([P.w[lang], P.w[otherLang()]]);
  }
  S.seen.push(P.w[lang]);
  S.level += 1;
  S.inPlace += 1;
  render();
  const card = document.getElementById('card');
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  document.getElementById('reward').textContent = (skipped ? `${t('skipped')} ${up(P.w[lang], lang)}` : t('correct')) + ` \u00b7 ${t('trans')}: ${P.w[otherLang()]}`;
  buzz(20);
  saveState();
  setTimeout(() => {
    if (S.inPlace >= PER_PLACE){ S.inPlace = 0; S.placeIdx += 1; saveState(); showTrip(); }
    else newPuzzle();
  }, skipped ? 1600 : 1100);
}

/* ---------- actions ---------- */
document.getElementById('revealBtn').onclick = () => {
  if (P.done) return;
  if (S.coins < 30){ toast(t('notEnough')); return; }
  const i = P.blanks.find(i => P.filled[i] === undefined || P.tiles[P.filled[i]].ch !== P.chars[i]);
  if (i === undefined) return;
  if (P.filled[i] !== undefined){ P.tiles[P.filled[i]].used = false; delete P.filled[i]; }
  let k = P.tiles.findIndex(tl => !tl.used && tl.ch === P.chars[i]);
  if (k < 0){   // the right tile is sitting in another blank
    const j = P.blanks.find(j => P.filled[j] !== undefined && P.tiles[P.filled[j]].ch === P.chars[i] && P.chars[j] !== P.chars[i]);
    if (j === undefined) return;
    k = P.filled[j]; delete P.filled[j];
  }
  P.filled[i] = k; P.tiles[k].used = true;
  P.blanks = P.blanks.filter(b => b !== i);   // revealed letters become given
  S.coins -= 30; saveState();
  render();
  if (P.blanks.every(i => P.filled[i] !== undefined)) check();
};
document.getElementById('shuffleBtn').onclick = () => { if (!P.done){ const order = shuffle([...P.tiles.keys()]);
  const map = {}; order.forEach((old, nw) => map[old] = nw); P.tiles = order.map(o => P.tiles[o]);
  for (const i in P.filled) P.filled[i] = map[P.filled[i]]; render(); } };
document.getElementById('skipBtn').onclick = () => { if (!P.done) win(true); };

/* ---------- trip overlay ---------- */
function preload(i){ const im = new Image(); im.src = `bg/${place(i)[0]}.jpg`; }
function showTrip(first){
  preload(S.placeIdx + 1);
  const p = place(S.placeIdx);
  setBg(S.placeIdx);
  document.getElementById('tripSmall').textContent = first ? t('welcome') : t('next');
  document.getElementById('tripName').textContent = placeName(p);
  document.getElementById('tripWhere').textContent = placeCountry(p);
  document.getElementById('tripFact').innerHTML = `<b>${t('fact')}</b><br>${placeFact(p)}`;
  document.getElementById('tripGo').textContent = t('go');
  document.getElementById('trip').classList.remove('hidden');
}
document.getElementById('tripGo').onclick = () => { document.getElementById('trip').classList.add('hidden'); newPuzzle(); };

/* ---------- home ---------- */
function renderHome(){
  document.documentElement.lang = lang;
  document.getElementById('tagline').textContent = t('tagline');
  document.getElementById('lblLang').textContent = t('lang');
  document.getElementById('lblLevel').textContent = t('level');
  document.getElementById('lblWords').textContent = t('words');
  document.getElementById('lblPlaces').textContent = t('places');
  document.getElementById('stLevel').textContent = S.level;
  document.getElementById('stWords').textContent = S.solved.length;
  document.getElementById('stPlaces').textContent = Math.min(S.placeIdx + 1, 999);
  document.getElementById('playBtn').textContent = S.level > 1 ? t('cont') : t('play');
  document.getElementById('wordsBtn').textContent = t('myWords');
  document.getElementById('aboutBtn').textContent = t('about');
  document.getElementById('lblReveal').textContent = t('reveal');
  document.getElementById('lblSkip').textContent = t('skip');
  document.querySelectorAll('.lang').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  document.querySelectorAll('[data-close]').forEach(b => b.textContent = t('close'));
}
document.querySelectorAll('.lang').forEach(b => b.onclick = () => {
  if (b.dataset.lang === lang) return;
  saveState(); lang = b.dataset.lang; S = loadState(); saveState(); renderHome(); setBg(S.placeIdx);
});
document.getElementById('playBtn').onclick = () => {
  document.getElementById('home').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  if (S.level === 1 && S.inPlace === 0) showTrip(true); else newPuzzle();
};
document.getElementById('homeBtn').onclick = () => {
  document.getElementById('game').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  renderHome();
};
document.getElementById('wordsBtn').onclick = () => {
  document.getElementById('wordsTitle').textContent = t('wordsTitle');
  document.getElementById('wordsSub').textContent = t('wordsSub');
  const list = document.getElementById('wordList');
  list.innerHTML = S.solved.length ? '' : `<div class="empty">${t('none')}</div>`;
  S.solved.slice().reverse().forEach(([a, b]) => { const d = document.createElement('div');
    d.innerHTML = `<span></span><span></span>`; d.children[0].textContent = up(a, lang); d.children[1].textContent = b; list.appendChild(d); });
  document.getElementById('wordsSheet').classList.remove('hidden');
};
document.getElementById('aboutBtn').onclick = () => {
  document.getElementById('aboutTitle').textContent = t('aboutTitle');
  document.getElementById('aboutText').textContent = t('aboutText');
  const r = document.getElementById('resetBtn'); r.textContent = t('reset'); r.dataset.armed = '';
  document.getElementById('aboutSheet').classList.remove('hidden');
};
document.getElementById('resetBtn').onclick = e => {
  const r = e.currentTarget;
  if (!r.dataset.armed){ r.dataset.armed = '1'; r.textContent = t('resetSure'); return; }
  S = freshState(); saveState(); renderHome(); setBg(0);
  document.getElementById('aboutSheet').classList.add('hidden');
};
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => {
  if (e.target === s || e.target.hasAttribute('data-close')) s.classList.add('hidden');
}));

/* ---------- misc ---------- */
let toastTimer;
function toast(m){ const el = document.getElementById('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1600); }
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
window.addEventListener('resize', () => { if (P && !document.getElementById('game').classList.contains('hidden')) render(); });

renderHome();
setBg(S.placeIdx);
if ('serviceWorker' in navigator){ try { navigator.serviceWorker.register('sw.js'); } catch(e){} }
</script>
